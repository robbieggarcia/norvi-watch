name: Norvi watch

# A plain Python check (no AI) of heynorvi.com and, once it is live, app.heynorvi.com/healthz, every
# 30 minutes. It speaks up only when something changed, or a failure is still open 6 hours later: an
# issue labeled norvi-tripwire here, and a wake-up for the Norvi Manager routine.
# Public repo, so Actions minutes are free. Only these two triggers, on purpose: never add pull_request
# or pull_request_target, so no outside change can ever run with this repo's secrets.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: norvi-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NORVI_ROUTINE_ID: ${{ secrets.NORVI_ROUTINE_ID }}
          NORVI_ROUTINE_TOKEN: ${{ secrets.NORVI_ROUTINE_TOKEN }}
        run: python3 tools/norvi_tripwire.py --only site,backend
      - name: Save state when it changed
        run: |
          git add tripwire/norvi-state.json
          git diff --cached --quiet && exit 0
          git -c user.name="Norvi watch" -c user.email="watch@norvi.local" commit -qm "Norvi watch: state changed"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
